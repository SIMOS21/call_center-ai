name: commerceops-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerceops
      POSTGRES_USER: commerceops
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?local password required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - commerceops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceops -d commerceops"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
volumes:
  commerceops_pg:
