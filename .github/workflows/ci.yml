name: Tests and safety gates
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install base and quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Security-significant lints
        run: ruff check app tests scripts --select E4,E7,E9,F63,F7,F82
      - name: Automated tests
        run: python -m pytest tests -q
      - name: Check there are no committed secrets
        shell: bash
        run: |
          test ! -f .env || (echo '.env must not be committed' && exit 1)
          test ! -f data/commerceops.sqlite3 || exit 1
      - name: Offline source hygiene and fail-closed quality gates
        run: |
          python -m scripts.check_secrets
          python -m scripts.quality_gate
